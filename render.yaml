# =============================================================================
# Render Blueprint - Sistema de Gestión Hospitalaria
# Docs: https://render.com/docs/blueprint-spec
#
# Componentes:
#   1. hospital-db        -> PostgreSQL administrado
#   2. hospital-backend   -> Web Service (Spring Boot 3.3.4 / Java 21, runtime Docker)
#   3. hospital-frontend  -> Static Site (Angular 18)
#
# Todos los recursos usan la misma región para comunicarse por red privada.
# =============================================================================

databases:
  - name: hospital-db
    databaseName: hospital_db
    user: hospital_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    # Sin IPs externas permitidas: solo los servicios de Render acceden a la BD.
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # Backend: Spring Boot
  # Render no tiene runtime nativo de Java, por eso se usa Docker
  # (requiere un Dockerfile en la raíz del repositorio).
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    # Solo redeploy cuando cambie el backend.
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
      # Credenciales de la BD inyectadas desde el recurso administrado.
      # (connectionString de Render no es formato JDBC, por eso se pasan
      # por separado y se arma la URL en application-prod.properties).
      - key: DB_HOST
        fromDatabase:
          name: hospital-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hospital-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hospital-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hospital-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospital-db
          property: password
      # Origen permitido para CORS (URL pública del Static Site).
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospital-frontend.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend: Angular 18 (builder "application" -> salida en /browser)
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-frontend
    runtime: static
    branch: main
    rootDir: frontend-angular
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/frontend-angular/browser
    autoDeploy: true
    buildFilter:
      paths:
        - frontend-angular/**
    envVars:
      - key: NODE_VERSION
        value: "20"
    # Fallback de rutas para el router de Angular (SPA).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Assets con hash en el nombre: caché larga e inmutable.
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
