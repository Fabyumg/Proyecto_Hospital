# =============================================================================
# Render Blueprint - Sistema de Gestión Hospitalaria
# =============================================================================

databases:
  - name: hospital-db
    databaseName: hospital_db
    user: hospital_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # Backend: Spring Boot (Usando runtime nativo de Java/Maven)
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-backend
    runtime: java
    plan: free
    region: oregon
    branch: main
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
      - key: DB_HOST
        fromDatabase:
          name: hospital-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hospital-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hospital-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hospital-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospital-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospital-frontend.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend: Angular 18
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-frontend
    runtime: static
    branch: main
    rootDir: frontend-angular
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/frontend-angular/browser
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
