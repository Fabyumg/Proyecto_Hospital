spring.application.name=hospital-backend

# ============================================================================
# 1. CONFIGURACIÓN BASE DE DATOS (H2 en memoria con compatibilidad SQL Server)
# ============================================================================
# Modo activo por defecto para prueba inmediata y funcional sin requerir credenciales sa
spring.datasource.url=jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------------------------
# PARA USAR SQL SERVER SSMS NATIVO: Descomenta las 4 líneas siguientes y pon la clave sa de tu SQL Server
# ----------------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hospital_db;encrypt=false;trustServerCertificate=true;
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=sa
# spring.datasource.password=TU_CONTRASEÑA_DE_SA
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ============================================================================
# 2. CONFIGURACIÓN DE SEGURIDAD Y JWT RSA
# ============================================================================
jwt.expiration-ms=28800000
jwt.issuer=HospitalManagementSystem

# Ruta de llaves RSA (se auto-generan dinámicamente en memoria)
jwt.rsa.private-key-path=classpath:keys/private_key.pem
jwt.rsa.public-key-path=classpath:keys/public_key.pem

# Server Port
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.gt.edu.umg=DEBUG


# ============================================================================
# 3. PROTECCIONES DEL LOGIN (Rate Limit, Intentos Fallidos, Turnstile)
# ============================================================================
# Rate limiting: maximo de solicitudes por minuto por IP a /api/auth/login
security.rate-limit.login.max-requests-per-minute=10
# Intentos fallidos consecutivos antes de bloquear y minutos de bloqueo
security.login.max-failed-attempts=5
security.login.lock-minutes=15

# Cloudflare Turnstile. Por defecto usa la clave secreta de PRUEBA de Cloudflare
# (siempre valida). En produccion definir TURNSTILE_SECRET_KEY con la clave real.
turnstile.enabled=${TURNSTILE_ENABLED:true}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
