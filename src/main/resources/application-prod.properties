# ============================================================================
# Perfil de PRODUCCION (Render) - se activa con SPRING_PROFILES_ACTIVE=prod
# Sobrescribe los valores de application.properties.
# ============================================================================

# Puerto asignado por Render (por defecto 8080)
server.port=${PORT:8080}

# --- PostgreSQL administrado por Render (variables inyectadas en render.yaml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Pool pequeño: el plan free de PostgreSQL limita las conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Consola H2 deshabilitada en produccion
spring.h2.console.enabled=false

# --- CORS: origenes permitidos (separados por coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.gt.edu.umg=INFO

# Detras del proxy HTTPS de Render
server.forward-headers-strategy=framework
